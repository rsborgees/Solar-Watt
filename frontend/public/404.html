<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Solar Eleven Watt</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side routing, so a direct hit or refresh
      // on a route like /Solar-Watt/financiamento serves this 404 page
      // instead. This redirects back to index.html with the original path
      // encoded in the query string; index.html decodes it back with
      // history.replaceState before React Router takes over.
      // Pattern: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1 // keep "/Solar-Watt"

      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
