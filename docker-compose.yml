services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: solarwatt
      POSTGRES_PASSWORD: solarwatt
      POSTGRES_DB: solarwatt
    ports:
      - '5434:5432'
    volumes:
      - solarwatt_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U solarwatt']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  solarwatt_db_data:
